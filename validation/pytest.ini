[pytest]
pythonpath = ..
log_file = pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
# Jenkins Run Filters
daily: for the jenkins daily runs
weekly: for the jenkins daily runs

# skip marker with the reason why it is skipped
skip_not_ready: skipping a test because the implementation is not finished yet

# Feature Files
python: for python only
cpp: for C++ only
